version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379/0
      - SESSION_DIR=/workspace/sessions
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
    volumes:
      - ./backend/app:/app/app
      - ./sessions:/workspace/sessions
    depends_on:
      - redis
      - playwright-deps
    networks:
      - openmanus-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - openmanus-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - openmanus-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - openmanus-network
    restart: unless-stopped
    # Uncomment to pull a model automatically (optional)
    # command: ["sh", "-c", "ollama serve & sleep 5 && ollama pull llama3.1 && wait"]

  playwright-deps:
    image: mcr.microsoft.com/playwright/python:v1.40.0-jammy
    command: ["echo", "Playwright dependencies installed"]
    networks:
      - openmanus-network

networks:
  openmanus-network:
    driver: bridge

volumes:
  ollama-data:
